<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #cfdde8; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import { createStackScene } from "./stack-scene.js"
      const canvas = document.getElementById("c")
      try {
        const scene = createStackScene({ canvas, animate: false, opaque: true })
        scene.resize(innerWidth, innerHeight, 1)
        scene.renderNow()
        // Headless screenshots skip WebGL canvases, so show the frame as an image.
        const img = new Image()
        img.src = canvas.toDataURL("image/png")
        img.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh"
        document.body.appendChild(img)
        await img.decode()
      } catch (e) {
        document.body.innerHTML = `<pre style="font:40px monospace;color:#b3261e">${e}</pre>`
      }
    </script>
  </body>
</html>
